name: RawRec end-to-end (emulator, real stream)
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rawrec-e2e
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.10.2
        run: |
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 5 --retry-delay 10 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip && break
            sleep 20
          done
          unzip -q /tmp/gradle.zip -d /tmp && echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Build debug APK (with the test hook)
        run: |
          for i in 1 2 3; do gradle :app:assembleDebug --no-daemon && exit 0; sleep 30; done; exit 1
      - name: RTMP server (MediaMTX) and ffmpeg on the runner
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          curl -fsSL -o /tmp/mtx.tgz https://github.com/bluenviron/mediamtx/releases/download/v1.9.3/mediamtx_v1.9.3_linux_amd64.tar.gz
          mkdir -p /tmp/mtx && tar xzf /tmp/mtx.tgz -C /tmp/mtx
          sed -i 's/^rtsp: yes/rtsp: no/; s/^hls: yes/hls: no/; s/^webrtc: yes/webrtc: no/; s/^srt: yes/srt: no/' /tmp/mtx/mediamtx.yml
          (cd /tmp/mtx && nohup ./mediamtx mediamtx.yml > /tmp/mtx.log 2>&1 &)
          sleep 2; cat /tmp/mtx.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator (Android 14, x86_64) from the runner's own SDK
        run: |
          SDK=$ANDROID_HOME; SM=$SDK/cmdline-tools/latest/bin/sdkmanager; AM=$SDK/cmdline-tools/latest/bin/avdmanager
          yes | $SM --licenses > /dev/null 2>&1 || true
          $SM --install "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64" > /tmp/sdk.log 2>&1 || (tail -20 /tmp/sdk.log; exit 1)
          echo no | $AM create avd -n e2e -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force
          nohup $SDK/emulator/emulator -avd e2e -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on > /tmp/emu.log 2>&1 &
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          $SDK/platform-tools/adb wait-for-device
          for i in $(seq 1 120); do [ "$($SDK/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break; sleep 5; done
          $SDK/platform-tools/adb shell getprop sys.boot_completed
          for k in window_animation_scale transition_animation_scale animator_duration_scale; do $SDK/platform-tools/adb shell settings put global $k 0; done
          $SDK/platform-tools/adb shell input keyevent 82
      - name: The real app streams, a viewer decodes it
        timeout-minutes: 20
        run: bash .github/e2e.sh
      - name: Commit the evidence
        if: always()
        run: |
          cp /tmp/mtx.log out/e2e-*/mediamtx.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/e2e-* || true
          git commit -m "e2e evidence [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
