name: برنامه ویندوز

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: انتشار به‌عنوان Release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ساخت فایل نصبی ویندوز
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # وابستگی‌های سرور داخل برنامه بسته‌بندی می‌شوند، پس بدون dev نصب می‌شوند
      - name: وابستگی‌های سرور
        working-directory: homelab-panel/server
        run: npm ci --omit=dev

      - name: ساخت رابط کاربری
        working-directory: homelab-panel/web
        run: |
          npm ci
          npm run build

      - name: وابستگی‌های برنامهٔ ویندوز
        working-directory: homelab-panel/desktop
        run: npm ci

      - name: ساخت فایل نصبی
        working-directory: homelab-panel/desktop
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: بارگذاری خروجی
        uses: actions/upload-artifact@v4
        with:
          name: ControlCenter-Setup
          path: |
            homelab-panel/desktop/dist/*.exe
            homelab-panel/desktop/dist/*.exe.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: انتشار
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          files: homelab-panel/desktop/dist/*.exe
          generate_release_notes: true
