name: RawRec downloads (one file each)
on:
  push:
    paths:
      - ".github/workflows/rawrec-download.yml"
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join the parts and check them against the delivered files
        run: |
          set -e
          mkdir -p dl
          cat "out/desktop-1.3.0/windows/RawRec Desktop-1.3.0.exe.part00" "out/desktop-1.3.0/windows/RawRec Desktop-1.3.0.exe.part01" > dl/RawRec-Studio-1.3.0-Setup.exe
          cat "out/desktop-1.3.0/macos/RawRec Desktop-1.3.0.dmg.part00" "out/desktop-1.3.0/macos/RawRec Desktop-1.3.0.dmg.part01" > dl/RawRec-Studio-1.3.0-macOS.dmg
          cp out/RawRec-8.1.apk dl/RawRec-8.1.apk
          printf '%s  %s\n' 85e70b942e970dae736cd3912b2ffed18727031c1c5667c5b9a0d7bb9fc5c2ab dl/RawRec-Studio-1.3.0-Setup.exe b07b615cc5b76f9854f989ce1b5fa1a0e139019b4d015ca7703d849085558940 dl/RawRec-Studio-1.3.0-macOS.dmg 565a6323610eae12084046d7dece9e1499220a434e266b30470b1b747ed1c74f dl/RawRec-8.1.apk | sha256sum -c
          ls -la dl
      - uses: actions/upload-artifact@v4
        with: { name: RawRec-Studio-1.3.0-Windows, path: dl/RawRec-Studio-1.3.0-Setup.exe, retention-days: 90, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        with: { name: RawRec-Studio-1.3.0-macOS, path: dl/RawRec-Studio-1.3.0-macOS.dmg, retention-days: 90, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        with: { name: RawRec-8.1-Android, path: dl/RawRec-8.1.apk, retention-days: 90, compression-level: 0 }
