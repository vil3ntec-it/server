name: برنامه ادمین اندروید

on:
  push:
    branches: ['claude/**', main]
    paths:
      # ⚠️ نسخهٔ برنامه از package.json سرور خوانده می‌شود، پس هر به‌روزرسانیِ
      #    سرور هم باید ساختِ تازه بدهد — وگرنه برنامه عقب می‌ماند و
      #    «به‌روزرسانیِ تازه» هیچ‌وقت دیده نمی‌شود.
      - 'homelab-panel/admin-android/**'
      - 'homelab-panel/server/package.json'
      - '.github/workflows/admin-android.yml'
  workflow_dispatch:

concurrency:
  group: admin-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ساخت فایل نصبی ادمین
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4

      #  ⛔ SEC-ART-05: کلیدِ امضا فقط از secret؛ فایل و رمزش دیگر در مخزنِ (عمومیِ) پیشین نیستند و برگشتی
      #  هم نیست — بی secret این کار قرمز است (docs/RULES-fa.md، «کلیدِ امضای برنامهٔ ادمین»).
      - name: کلیدِ امضا
        env:
          KEYSTORE_B64: ${{ secrets.VILLAIN_ADMIN_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::secret به نام VILLAIN_ADMIN_KEYSTORE_B64 (و VILLAIN_ADMIN_KEYSTORE_PASSWORD، VILLAIN_ADMIN_KEY_ALIAS) تنظیم نشده"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/villain-admin.jks"
          echo "VILLAIN_ADMIN_KEYSTORE=$RUNNER_TEMP/villain-admin.jks" >> "$GITHUB_ENV"

      - name: ساخت APK
        working-directory: homelab-panel/admin-android
        env:
          VILLAIN_ADMIN_KEYSTORE_PASSWORD: ${{ secrets.VILLAIN_ADMIN_KEYSTORE_PASSWORD }}
          VILLAIN_ADMIN_KEY_ALIAS: ${{ secrets.VILLAIN_ADMIN_KEY_ALIAS }}
          VILLAIN_ADMIN_KEY_PASSWORD: ${{ secrets.VILLAIN_ADMIN_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: نام‌گذاری و جمع کنترلی
        working-directory: homelab-panel/admin-android
        run: |
          mkdir -p out
          version=$(grep -oP '"version"\s*:\s*"\K[^"]+' ../server/package.json | head -1)
          cp app/build/outputs/apk/release/app-release.apk "out/VillainAdmin-$version.apk"
          cd out
          sha256sum "VillainAdmin-$version.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "APP_VERSION=$version" >> $GITHUB_ENV

      - name: بارگذاری خروجی
        uses: actions/upload-artifact@v4
        with:
          name: VillainAdmin
          path: homelab-panel/admin-android/out/*
          if-no-files-found: error
          retention-days: 30

      # ── انتشار ─────────────────────────────────────────────────────────
      # برچسب روی همین ساخت می‌نشیند، وگرنه فایلِ منتشرشده مالِ یک کامیتِ
      # قدیمی می‌ماند و به‌روزرسانیِ داخلِ برنامه نسخهٔ کهنه می‌گیرد.
      # ⛔ **فقط main منتشر می‌کند.** برچسبِ `admin-android` همان کانالی است که
      #    برنامهٔ نصب‌شده از آن به‌روزرسانی می‌گیرد (`Updater.TAG`)؛ ساختِ یک شاخهٔ
      #    کاری کدِ مرج‌نشده را به‌عنوانِ «به‌روزرسانی» روی گوشیِ صاحبِ سامانه
      #    می‌فرستاد — همان باگی که ۱.۵۰.۵ برای `windows-preview` بست. شاخه‌ها
      #    فقط می‌سازند (سنجشِ کامپایل) و فایل را در artifact می‌گذارند.
      - name: جابه‌جا کردن برچسب
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/admin-android" \
            -f sha='${{ github.sha }}' -F force=true \
          || gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f ref='refs/tags/admin-android' -f sha='${{ github.sha }}'

      - name: انتشار
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-android
          name: ویلن ادمین — برنامهٔ اندروید
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: |
            homelab-panel/admin-android/out/*.apk
            homelab-panel/admin-android/out/SHA256SUMS.txt
          body: |
            ## ویلن ادمین

            برنامهٔ مدیریتِ سرور روی گوشی: کدهای شش‌رقمی، حساب‌ها، اشتراک‌ها،
            و پشتیبانی در سه بخشِ پمپ و فروشگاه و سایت‌ها.

            **نسخهٔ ${{ env.APP_VERSION }}** — همان شمارهٔ سرور، چون با هر
            به‌روزرسانیِ سرور این هم تازه می‌شود.

            ### نصب
            فایل `VillainAdmin-${{ env.APP_VERSION }}.apk` را روی گوشی باز کنید.
            بارِ اول اندروید اجازهٔ «نصب از این منبع» می‌خواهد.

            بعد از نصب، آدرسِ سرور و نامِ کاربری و رمزِ پنل را می‌زنید و تمام.
            به‌روزرسانی‌های بعدی از داخلِ خودِ برنامه می‌آید و اگر دانلود وسطِ
            کار قطع شد، از همان‌جا ادامه می‌گیرد.

            ---
            <sub>ساخته‌شده از `${{ github.sha }}` روی شاخهٔ `${{ github.ref_name }}`</sub>

      - name: پاک کردن فایل‌های نسخه‌های قبلی
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep="VillainAdmin-${{ env.APP_VERSION }}.apk SHA256SUMS.txt"
          gh api "repos/${{ github.repository }}/releases/tags/admin-android" \
            --jq '.assets[] | "\(.id) \(.name)"' | while read -r id name; do
              case " $keep " in
                *" $name "*) continue ;;
              esac
              echo "پاک کردن $name"
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
            done
          echo 'فقط فایل‌های همین ساخت ماندند.'
