name: RawRec APK (temporary)
on:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ‎ubuntu-latest‎ خودش Android SDK دارد (ANDROID_HOME)؛ setup-android@v3 با «sdkmanager tools» می‌شکست
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Commit APK back to this temporary branch
        run: |
          set -e
          ls -la app/build/outputs/apk/release/
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/RawRec-1.9-unsigned.apk
          sha256sum out/RawRec-1.9-unsigned.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/RawRec-1.9-unsigned.apk
          git commit -m "APK (unsigned) — temporary"
          git push
