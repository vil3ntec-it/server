name: RawRec APK (temporary)
on:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ‎ubuntu-latest‎ خودش Android SDK دارد (ANDROID_HOME)؛ setup-android@v3 با «sdkmanager tools» می‌شکست
      # Gradle downloaded directly, with retries (GitHub's cache service answered 504 again and again)
      - name: Gradle 8.10.2
        run: |
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 5 --retry-delay 10 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip && break
            sleep 20
          done
          unzip -q /tmp/gradle.zip -d /tmp && echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Build unsigned release APK
        run: |
          for i in 1 2 3; do
            gradle :app:assembleRelease --no-daemon --stacktrace && exit 0
            echo "build attempt $i failed (network?), retrying"; sleep 30
          done
          exit 1
      - name: Shaders (GLSL ES 1.00, as phones compile them)
        continue-on-error: true
        run: |
          (sudo apt-get install -y -qq glslang-tools || (sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools)) >/dev/null
          mkdir -p out
          python3 .github/glsl_check.py app/src/main/java/com/vil3ntec/rawrec/LookFilter.kt out/shaders-6.4.txt
      - name: All unit tests (every control tapped like a finger) + preview pictures
        continue-on-error: true
        timeout-minutes: 60
        run: |
          mkdir -p out/previews-6.4
          gradle :app:testReleaseUnitTest --no-daemon --continue -Drawrec.previewDir=$PWD/out/previews-6.4 || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tot = fail = skip = 0; lines = []
          for f in sorted(glob.glob('app/build/test-results/testReleaseUnitTest/*.xml')):
              r = ET.parse(f).getroot()
              tot += int(r.get('tests', 0)); skip += int(r.get('skipped', 0))
              for tc in r.iter('testcase'):
                  for bad in list(tc.findall('failure')) + list(tc.findall('error')):
                      fail += 1
                      msg = (bad.get('message') or '')[:300].replace('\n', ' ')
                      tr = (bad.text or '').strip().splitlines()
                      keep = tr[:3] + [l for l in tr[3:] if 'com.vil3ntec' in l or 'Caused by' in l][:14]
                      lines.append(f"FAIL {tc.get('classname')}.{tc.get('name')}: {msg}\n    " + "\n    ".join(keep))
          open('out/tests-6.4.txt', 'w').write(f"tests {tot}, failed {fail}, skipped {skip}\n" + "\n".join(lines) + "\n")
          print(open('out/tests-6.4.txt').read())
          PY
          ls -la out/previews-6.4
      - name: Commit APK back to this temporary branch
        run: |
          set -e
          ls -la app/build/outputs/apk/release/
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/RawRec-6.4-unsigned.apk
          sha256sum out/RawRec-6.4-unsigned.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/RawRec-6.4-unsigned.apk
          git add -f out/previews-6.4 out/tests-6.4.txt out/shaders-6.4.txt || true
          git commit -m "APK (unsigned) — temporary"
          git push
