name: RawRec APK (temporary)
on:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ‎ubuntu-latest‎ خودش Android SDK دارد (ANDROID_HOME)؛ setup-android@v3 با «sdkmanager tools» می‌شکست
      # Gradle downloaded directly, with retries (GitHub's cache service answered 504 again and again)
      - name: Gradle 8.10.2
        run: |
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 5 --retry-delay 10 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip && break
            sleep 20
          done
          unzip -q /tmp/gradle.zip -d /tmp && echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Build unsigned release APK
        run: |
          for i in 1 2 3; do
            gradle :app:assembleRelease --no-daemon --stacktrace && exit 0
            echo "build attempt $i failed (network?), retrying"; sleep 30
          done
          exit 1
      - name: Shaders (GLSL ES 1.00, as phones compile them)
        continue-on-error: true
        run: |
          (sudo apt-get install -y -qq glslang-tools || (sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools)) >/dev/null
          mkdir -p out
          python3 .github/glsl_check.py app/src/main/java/com/vil3ntec/rawrec/LookFilter.kt out/shaders-7.8.txt
      - name: All unit tests (every control tapped like a finger) + preview pictures
        continue-on-error: true
        timeout-minutes: 60
        run: |
          mkdir -p out/previews-7.8
          gradle :app:testReleaseUnitTest --no-daemon --continue -Drawrec.previewDir=$PWD/out/previews-7.8 || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tot = fail = skip = 0; lines = []
          for f in sorted(glob.glob('app/build/test-results/testReleaseUnitTest/*.xml')):
              r = ET.parse(f).getroot()
              tot += int(r.get('tests', 0)); skip += int(r.get('skipped', 0))
              for tc in r.iter('testcase'):
                  for bad in list(tc.findall('failure')) + list(tc.findall('error')):
                      fail += 1
                      msg = (bad.get('message') or '')[:300].replace('\n', ' ')
                      tr = (bad.text or '').strip().splitlines()
                      keep = tr[:3] + [l for l in tr[3:] if 'com.vil3ntec' in l or 'Caused by' in l][:14]
                      lines.append(f"FAIL {tc.get('classname')}.{tc.get('name')}: {msg}\n    " + "\n    ".join(keep))
          open('out/tests-7.8.txt', 'w').write(f"tests {tot}, failed {fail}, skipped {skip}\n" + "\n".join(lines) + "\n")
          print(open('out/tests-7.8.txt').read())
          PY
          ls -la out/previews-7.8
      - name: Commit APK back to this temporary branch
        run: |
          set -e
          ls -la app/build/outputs/apk/release/
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/RawRec-7.8-unsigned.apk
          sha256sum out/RawRec-7.8-unsigned.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/RawRec-7.8-unsigned.apk
          git add -f out/previews-7.8 out/tests-7.8.txt out/shaders-7.8.txt || true
          git commit -m "APK (unsigned) — temporary"
          git push
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.10.2
        run: |
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 5 --retry-delay 10 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip && break
            sleep 20
          done
          unzip -q /tmp/gradle.zip -d /tmp && echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Build debug APK (with the test hook)
        run: |
          for i in 1 2 3; do gradle :app:assembleDebug --no-daemon && exit 0; sleep 30; done; exit 1
      - name: RTMP server (MediaMTX) and ffmpeg on the runner
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          curl -fsSL -o /tmp/mtx.tgz https://github.com/bluenviron/mediamtx/releases/download/v1.9.3/mediamtx_v1.9.3_linux_amd64.tar.gz
          mkdir -p /tmp/mtx && tar xzf /tmp/mtx.tgz -C /tmp/mtx
          sed -i 's/^rtsp: yes/rtsp: no/; s/^hls: yes/hls: no/; s/^webrtc: yes/webrtc: no/; s/^srt: yes/srt: no/' /tmp/mtx/mediamtx.yml
          (cd /tmp/mtx && nohup ./mediamtx mediamtx.yml > /tmp/mtx.log 2>&1 &)
          sleep 2; cat /tmp/mtx.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator (Android 14, x86_64) from the runner's own SDK
        timeout-minutes: 20
        run: |
          SDK=$ANDROID_HOME; SM=$SDK/cmdline-tools/latest/bin/sdkmanager; AM=$SDK/cmdline-tools/latest/bin/avdmanager
          yes | $SM --licenses > /dev/null 2>&1 || true
          $SM --install "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64" > /tmp/sdk.log 2>&1 || (tail -20 /tmp/sdk.log; exit 1)
          export ANDROID_AVD_HOME=$HOME/.android/avd; mkdir -p $ANDROID_AVD_HOME
          echo no | $AM create avd -n e2e -k "system-images;android-34;google_apis;x86_64" -d pixel_tablet -p $ANDROID_AVD_HOME/e2e.avd --force
          ls $ANDROID_AVD_HOME; $SDK/emulator/emulator -list-avds
          nohup $SDK/emulator/emulator -avd e2e -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on > /tmp/emu.log 2>&1 &
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          timeout 600 $SDK/platform-tools/adb wait-for-device || { echo "emulator never came up"; tail -60 /tmp/emu.log; ls -la /dev/kvm; exit 1; }
          for i in $(seq 1 120); do [ "$($SDK/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break; sleep 5; done
          [ "$($SDK/platform-tools/adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] || { echo "boot not completed"; tail -60 /tmp/emu.log; exit 1; }
          for k in window_animation_scale transition_animation_scale animator_duration_scale; do $SDK/platform-tools/adb shell settings put global $k 0; done
          $SDK/platform-tools/adb shell input keyevent 82
      - name: The real app streams, a viewer decodes it
        timeout-minutes: 20
        run: bash .github/e2e.sh
      - name: Commit the evidence
        if: always()
        run: |
          cp /tmp/mtx.log out/e2e-*/mediamtx.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/e2e-* || true
          git commit -m "e2e evidence [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
