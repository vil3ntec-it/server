name: RawRec APK (temporary)
on:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ‎ubuntu-latest‎ خودش Android SDK دارد (ANDROID_HOME)؛ setup-android@v3 با «sdkmanager tools» می‌شکست
      # Gradle downloaded directly, with retries (GitHub's cache service answered 504 again and again)
      - name: Gradle 8.10.2
        run: |
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 5 --retry-delay 10 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip && break
            sleep 20
          done
          unzip -q /tmp/gradle.zip -d /tmp && echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Build unsigned release APK
        run: |
          for i in 1 2 3; do
            gradle :app:assembleRelease --no-daemon --stacktrace && exit 0
            echo "build attempt $i failed (network?), retrying"; sleep 30
          done
          exit 1
      - name: Preview pictures of the real drawing code (stream overlay, chat panel)
        continue-on-error: true
        run: |
          mkdir -p out/previews-3.3
          gradle :app:testReleaseUnitTest --no-daemon --tests 'com.vil3ntec.rawrec.OverlayRender' -Drawrec.previewDir=$PWD/out/previews-3.3 || true
          ls -la out/previews-3.3
      - name: Commit APK back to this temporary branch
        run: |
          set -e
          ls -la app/build/outputs/apk/release/
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/RawRec-3.3-unsigned.apk
          sha256sum out/RawRec-3.3-unsigned.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/RawRec-3.3-unsigned.apk
          git add -f out/previews-3.3 || true
          git commit -m "APK (unsigned) — temporary"
          git push
